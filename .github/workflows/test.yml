name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ['3.9', '3.13']
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q proof_gate scripts test
      - name: Unit tests
        run: python -m unittest discover -s test -v
      - name: Smoke scan
        run: python scripts/proof-gate.py scan . --json --fail-on never
